name: Agent patterns

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pattern frontmatter and embedded code
        run: python3 validate.py
      - name: Refuse a PR that touches the generated catalog
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- README.md llms.txt manifest.json)
          if [ -n "$changed" ]; then
            echo "This PR modifies a generated file: $changed"
            echo "README.md, llms.txt, and manifest.json are regenerated and committed by CI on merge to main — never edit them in a PR (see SPEC.md's CI section). Revert the change to these files and let CI regenerate them."
            exit 1
          fi

  regenerate-catalog:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate manifest.json, llms.txt, README.md
        run: python3 generate_catalog.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- manifest.json llms.txt README.md; then
            echo "catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json llms.txt README.md
          git commit -m "regenerate catalog from SKILL.md frontmatter"
          git push
